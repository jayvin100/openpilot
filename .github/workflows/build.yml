name: Build custom branches

# Rebuilds each target = latest official prebuilt branch + patches/<base>/*.patch:
#   nightly-jay = openpilot nightly, dev-jay / staging-jay = sunnypilot dev / staging.
# Skips when neither upstream nor the patches changed. Fails (and emails) if a patch no longer applies;
# the existing branch is left untouched in that case, so the device keeps its last good build.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false
  push:
    branches: [tools]
    paths: ['patches/**', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: openpilot
            repo: https://github.com/commaai/openpilot.git
            upstream: nightly
            target: nightly-jay
          - base: sunnypilot
            repo: https://github.com/sunnypilot/sunnypilot.git
            upstream: dev
            target: dev-jay
          - base: sunnypilot
            repo: https://github.com/sunnypilot/sunnypilot.git
            upstream: staging
            target: staging-jay
    env:
      UPSTREAM_REPO: ${{ matrix.repo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - name: Build ${{ matrix.target }}
        run: |
          set -euo pipefail
          patches=$(find tools/patches/${{ matrix.base }} -name '*.patch' | sort)
          patch_hash=$( (for p in $patches; do basename "$p"; cat "$p"; done) | sha256sum | cut -c1-16)
          upstream_sha=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/${{ matrix.upstream }}" | cut -f1)
          echo "upstream ${{ matrix.upstream }} = $upstream_sha, patches = $patch_hash"

          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ matrix.target }}" --jq .commit.message 2>/dev/null || true)
          if [ "${{ inputs.force }}" != "true" ] \
             && grep -qx "Upstream-Commit: $upstream_sha" <<<"$current" \
             && grep -qx "Patches-Hash: $patch_hash" <<<"$current"; then
            echo "Up to date, nothing to do."
            exit 0
          fi

          git init -q work && cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags "$UPSTREAM_REPO" "$upstream_sha"
          git checkout -q FETCH_HEAD
          upstream_title=$(git log -1 --format=%B | head -1)

          count=0
          for p in $patches; do
            echo "Applying $(basename "$p")"
            git apply --index --whitespace=nowarn "../$p"
            count=$((count + 1))
          done

          git commit -q --allow-empty -F - <<EOF
          ${{ matrix.target }}: $upstream_title + $count patch(es)

          Upstream-Branch: ${{ matrix.upstream }}
          Upstream-Commit: $upstream_sha
          Patches-Hash: $patch_hash
          EOF
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${{ matrix.target }}"
          echo "Pushed ${{ matrix.target }} $(git rev-parse --short HEAD)"
